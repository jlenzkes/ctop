name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: PowerShell version
        run: $PSVersionTable

      - name: Parse
        run: |
          $tokens = $null; $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./ctop.ps1), [ref]$tokens, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { Write-Error "$($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }

      - name: Version matches .NOTES
        run: |
          $out = & ./ctop.ps1 -Version
          if ($out -notmatch '^ctop (\d{4}\.\d{2}\.\d{2}\.\d+)$') { Write-Error "unexpected -Version output: $out"; exit 1 }
          $v = $Matches[1]
          $notes = (Get-Content ./ctop.ps1 -Raw) -cmatch 'VERSION (\d{4}\.\d{2}\.\d{2}\.\d+)'
          if (-not $notes) { Write-Error 'no VERSION line in .NOTES'; exit 1 }
          if ($Matches[1] -ne $v) { Write-Error "-Version says $v but .NOTES says $($Matches[1])"; exit 1 }
          "ctop $v"

      - name: PSScriptAnalyzer
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $r = Invoke-ScriptAnalyzer -Path ./ctop.ps1 -Settings ./PSScriptAnalyzerSettings.psd1
          $r | Format-Table -AutoSize
          if ($r) { exit 1 }

      - name: tmux (integration tests)
        if: runner.os == 'Linux'
        shell: bash
        run: command -v tmux || (sudo apt-get update -q && sudo apt-get install -y -q tmux)

      - name: Tests (Pester)
        run: |
          Install-Module Pester -RequiredVersion 5.9.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 5.9.1
          $c = New-PesterConfiguration
          $c.Run.Path = './tests'
          $c.Run.Exit = $true
          $c.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $c

  # Windows PowerShell 5.1, the version built into Windows. Informational (it does not fail the run):
  # ctop.ps1 is UTF-8 without a byte-order mark, which 5.1 reads as ANSI. The first steps check the
  # script as committed; the rest run it, and the unit tests, from copies saved with a BOM.
  windows-powershell-5:
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v7

      - name: PowerShell version
        run: $PSVersionTable

      - name: Parse (as committed)
        run: |
          $t = $null; $e = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path .\ctop.ps1), [ref]$t, [ref]$e)
          "parse errors: $(@($e).Count)"
          $e | Select-Object -First 5 | ForEach-Object { "  line $($_.Extent.StartLineNumber): $($_.Message)" }
          if ($e) { exit 1 }

      - name: -Version (as committed)
        if: always()
        run: |
          powershell -NoProfile -File .\ctop.ps1 -Version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Re-save script and tests as UTF-8 with BOM
        if: always()
        run: |
          foreach ($f in @(Get-Item .\ctop.ps1) + @(Get-ChildItem .\tests\*.ps1)) {
            $text = [IO.File]::ReadAllText($f.FullName, [Text.Encoding]::UTF8)
            [IO.File]::WriteAllText($f.FullName, $text, [Text.UTF8Encoding]::new($true))
          }

      - name: Parse (with BOM)
        if: always()
        run: |
          $t = $null; $e = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path .\ctop.ps1), [ref]$t, [ref]$e)
          "parse errors: $(@($e).Count)"
          $e | Select-Object -First 5 | ForEach-Object { "  line $($_.Extent.StartLineNumber): $($_.Message)" }
          if ($e) { exit 1 }

      - name: -Version (with BOM)
        if: always()
        run: |
          powershell -NoProfile -File .\ctop.ps1 -Version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Unit tests (with BOM)
        if: always()
        run: |
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
          Install-Module Pester -RequiredVersion 5.9.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 5.9.1
          $c = New-PesterConfiguration
          $c.Run.Path = '.\tests'
          $c.Run.Exit = $true
          $c.Filter.ExcludeTag = 'Integration'
          $c.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $c

  # The script on other Linux distributions, with PowerShell 7.6.9 from Microsoft's packages: the deb
  # from the GitHub release on Ubuntu, Microsoft's RHEL 9 rpm on UBI 9 (RHEL 9) and on Fedora (which
  # Microsoft's install docs do not list as supported).
  linux-distros:
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:22.04', 'registry.access.redhat.com/ubi9/ubi:latest', 'fedora:latest']
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - name: Install PowerShell 7.6.9, ps, tmux
        shell: sh
        run: |
          set -e
          if command -v apt-get >/dev/null; then
            apt-get update -q
            DEBIAN_FRONTEND=noninteractive apt-get install -y -q curl ca-certificates procps tmux
            curl -sSLf -o /tmp/pwsh.deb https://github.com/PowerShell/PowerShell/releases/download/v7.6.9/powershell_7.6.9-1.deb_amd64.deb
            DEBIAN_FRONTEND=noninteractive apt-get install -y -q /tmp/pwsh.deb
          else
            dnf install -y procps-ng
            dnf install -y tmux || echo "tmux not available here: integration tests will be skipped"
            dnf install -y https://packages.microsoft.com/rhel/9/prod/Packages/p/powershell-7.6.9-1.rh.x86_64.rpm
          fi
          head -2 /etc/os-release
          pwsh -NoProfile -c '$PSVersionTable.PSVersion.ToString()'

      - uses: actions/checkout@v7

      - name: -Version
        shell: pwsh
        run: ./ctop.ps1 -Version

      - name: Tests (Pester)
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 5.9.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 5.9.1
          $c = New-PesterConfiguration
          $c.Run.Path = './tests'
          $c.Run.Exit = $true
          $c.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $c

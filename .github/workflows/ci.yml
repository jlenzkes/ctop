name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: PowerShell version
        run: $PSVersionTable

      - name: Parse
        run: |
          $tokens = $null; $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./ctop.ps1), [ref]$tokens, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { Write-Error "$($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }

      - name: Version matches .NOTES
        run: |
          $out = & ./ctop.ps1 -Version
          if ($out -notmatch '^ctop (\d{4}\.\d{2}\.\d{2}\.\d+)$') { Write-Error "unexpected -Version output: $out"; exit 1 }
          $v = $Matches[1]
          $notes = (Get-Content ./ctop.ps1 -Raw) -cmatch 'VERSION (\d{4}\.\d{2}\.\d{2}\.\d+)'
          if (-not $notes) { Write-Error 'no VERSION line in .NOTES'; exit 1 }
          if ($Matches[1] -ne $v) { Write-Error "-Version says $v but .NOTES says $($Matches[1])"; exit 1 }
          "ctop $v"

      - name: PSScriptAnalyzer
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $r = Invoke-ScriptAnalyzer -Path ./ctop.ps1 -Settings ./PSScriptAnalyzerSettings.psd1
          $r | Format-Table -AutoSize
          if ($r) { exit 1 }

      - name: tmux (integration tests)
        if: runner.os == 'Linux'
        shell: bash
        run: command -v tmux || (sudo apt-get update -q && sudo apt-get install -y -q tmux)

      - name: Tests (Pester)
        run: |
          Install-Module Pester -RequiredVersion 5.9.1 -Scope CurrentUser -Force -SkipPublisherCheck
          ./tests/Run-Tests.ps1 -Integration ${{ runner.os == 'Linux' && 'Expect' || 'Skip' }}

      # The same inputs through main's ctop and this one, side by side (tests/Compare-Versions.ps1); fails if
      # this one fails a check. main's results are printed for comparison.
      - name: Compare with main
        if: runner.os == 'Linux'
        run: |
          git fetch --depth=1 origin main
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./tests/Compare-Versions.ps1 -Base FETCH_HEAD

  # Windows PowerShell 5.1, the version built into Windows: the script as committed (UTF-8 with BOM,
  # which 5.1 needs to read its non-ASCII characters), and the unit tests. The end-to-end tests need
  # tmux, so they run on Linux only.
  windows-powershell-5:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v7

      - name: PowerShell version
        run: $PSVersionTable

      - name: Parse
        run: |
          $t = $null; $e = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path .\ctop.ps1), [ref]$t, [ref]$e)
          "parse errors: $(@($e).Count)"
          $e | Select-Object -First 5 | ForEach-Object { "  line $($_.Extent.StartLineNumber): $($_.Message)" }
          if ($e) { exit 1 }

      - name: -Version
        run: |
          powershell -NoProfile -File .\ctop.ps1 -Version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Unit tests (Pester)
        run: |
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
          Install-Module Pester -RequiredVersion 5.9.1 -Scope CurrentUser -Force -SkipPublisherCheck
          .\tests\Run-Tests.ps1 -Integration Skip

  # The script on other Linux distributions, with PowerShell 7.6.9 from Microsoft's packages: the deb
  # from the GitHub release on Ubuntu / Debian, Microsoft's RHEL 9 rpm on the RHEL 9 family and on Fedora
  # (Microsoft's install docs have no Fedora page; the RHEL 9 package works there).
  linux-distros:
    strategy:
      fail-fast: false
      matrix:
        # Debian family: Ubuntu 22.04, Debian 12. Fedora family: RHEL 9 (UBI 9: Red Hat's own packages, but
        # no tmux, so no end-to-end tests), AlmaLinux 9 and Rocky Linux 9 (RHEL 9 rebuilds with tmux), Fedora.
        # Rocky: rockylinux/rockylinux is the maintained image; the official rockylinux:9 stopped in 2024.
        # integration: Expect = tmux must install and every end-to-end test must run; Skip = left out on purpose
        include:
          - { image: 'ubuntu:22.04', integration: Expect }
          - { image: 'debian:12', integration: Expect }
          - { image: 'registry.access.redhat.com/ubi9/ubi:latest', integration: Skip }   # UBI's repositories have no tmux
          - { image: 'almalinux:9', integration: Expect }
          - { image: 'rockylinux/rockylinux:9', integration: Expect }
          - { image: 'fedora:latest', integration: Expect }
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - name: Install PowerShell 7.6.9, ps, tmux
        shell: sh
        run: |
          set -e
          if command -v apt-get >/dev/null; then
            apt-get update -q
            DEBIAN_FRONTEND=noninteractive apt-get install -y -q curl ca-certificates procps tmux
            curl -sSLf -o /tmp/pwsh.deb https://github.com/PowerShell/PowerShell/releases/download/v7.6.9/powershell_7.6.9-1.deb_amd64.deb
            DEBIAN_FRONTEND=noninteractive apt-get install -y -q /tmp/pwsh.deb
          else
            dnf install -y procps-ng
            if [ "${{ matrix.integration }}" = Expect ]; then dnf install -y tmux; fi
            dnf install -y https://packages.microsoft.com/rhel/9/prod/Packages/p/powershell-7.6.9-1.rh.x86_64.rpm
          fi
          head -2 /etc/os-release
          pwsh -NoProfile -c '$PSVersionTable.PSVersion.ToString()'

      - uses: actions/checkout@v7

      - name: -Version
        shell: pwsh
        run: ./ctop.ps1 -Version

      - name: Tests (Pester)
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 5.9.1 -Scope CurrentUser -Force -SkipPublisherCheck
          ./tests/Run-Tests.ps1 -Integration ${{ matrix.integration }}
